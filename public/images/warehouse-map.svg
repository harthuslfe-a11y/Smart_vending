<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="mapbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#mapbg)"/>
  <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#38bdf8">WAREHOUSE / GODOWN FACILITY LAYOUT MAP (గోడౌన్ మ్యాప్)</text>
  
  <!-- Godown 1 -->
  <g transform="translate(30, 60)">
    <rect width="250" height="250" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#38bdf8">GODOWN 1 (గోడౌన్ 1)</text>
    
    <!-- Left Corner (Ropes) -->
    <rect x="15" y="45" width="105" height="85" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="70" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#ffffff">📍 LEFT CORNER</text>
    <text x="25" y="88" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#bae6fd">Ropes (తాళ్లు)</text>
    <circle cx="105" cy="115" r="5" fill="#22c55e"/>
    
    <!-- Central Shelf 2 (Gloves) -->
    <rect x="70" y="145" width="110" height="45" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="165" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f1f5f9">SHELF 2</text>
    <text x="80" y="180" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#94a3b8">Gloves (చేతి తొడుగులు)</text>
    
    <!-- Right Bin 05 (Torch) -->
    <rect x="135" y="45" width="100" height="85" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="145" y="70" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f1f5f9">RIGHT BIN 05</text>
    <text x="145" y="88" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#94a3b8">LED Torch (టార్చ్)</text>
    
    <text x="15" y="235" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Main Entry Gate 1 ⬇</text>
  </g>

  <!-- Godown 2 -->
  <g transform="translate(310, 60)">
    <rect width="255" height="120" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="15" y="25" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#cbd5e1">GODOWN 2 (గోడౌన్ 2)</text>
    <!-- Rack A3 (Helmet) -->
    <rect x="15" y="38" width="105" height="65" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="25" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f1f5f9">RACK A3</text>
    <text x="25" y="74" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#94a3b8">Helmets (హెల్మెట్)</text>
    <!-- Section B (Toolkit) -->
    <rect x="135" y="38" width="105" height="65" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="145" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f1f5f9">SECTION B</text>
    <text x="145" y="74" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#94a3b8">Tool Kit (టూల్ కిట్)</text>
  </g>

  <!-- Godown 3 -->
  <g transform="translate(310, 190)">
    <rect width="255" height="120" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="15" y="25" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#cbd5e1">GODOWN 3 (గోడౌన్ 3)</text>
    <!-- Bay 4 (Ratchet belts) -->
    <rect x="15" y="38" width="225" height="65" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="25" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f1f5f9">BAY 4 - HEAVY RIGGING</text>
    <text x="25" y="74" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#94a3b8">Ratchet Straps (రాట్చెట్ బెల్టులు)</text>
  </g>
</svg>
