<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="110" fill="#334155" opacity="0.3"/>
  <!-- Coiled Ropes -->
  <g filter="url(#shadow)">
    <!-- Base coil loops -->
    <ellipse cx="200" cy="180" rx="110" ry="45" fill="none" stroke="url(#ropeGrad)" stroke-width="26" stroke-dasharray="14 4"/>
    <ellipse cx="200" cy="160" rx="100" ry="42" fill="none" stroke="url(#highlight)" stroke-width="24" stroke-dasharray="14 4"/>
    <ellipse cx="200" cy="140" rx="90" ry="38" fill="none" stroke="url(#ropeGrad)" stroke-width="22" stroke-dasharray="12 4"/>
    <ellipse cx="200" cy="120" rx="80" ry="34" fill="none" stroke="url(#highlight)" stroke-width="20" stroke-dasharray="12 4"/>
    <ellipse cx="200" cy="100" rx="68" ry="28" fill="none" stroke="url(#ropeGrad)" stroke-width="18" stroke-dasharray="10 3"/>
    
    <!-- Vertical binding bands -->
    <rect x="135" y="85" width="22" height="110" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="245" y="85" width="22" height="110" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    
    <!-- End rope whip hook -->
    <path d="M 200 80 Q 230 40 270 55 Q 295 68 285 100" fill="none" stroke="url(#ropeGrad)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="280" cy="100" r="10" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
  </g>
  <!-- Godown Badge -->
  <g transform="translate(20, 20)">
    <rect width="160" height="30" rx="6" fill="#0284c7" opacity="0.9"/>
    <text x="10" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff">📍 GODOWN 1: LEFT CORNER</text>
  </g>
  <g transform="translate(20, 255)">
    <rect width="130" height="26" rx="6" fill="#334155" opacity="0.9"/>
    <text x="10" y="17" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">20m Industrial Grade</text>
  </g>
</svg>
